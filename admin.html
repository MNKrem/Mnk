<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MNK Remodeling — Add Project Photos</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="images/logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#faf7f2; --bg-alt:#f1ebe0; --surface:#ffffff; --ink:#1f241f; --ink-dim:#6b6459;
    --line:#e4dccb; --accent:#3c5943; --accent-soft:rgba(60,89,67,0.09);
    box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *,*::before,*::after{box-sizing:inherit;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;font-size:16px;line-height:1.6;}
  h1,h2{font-family:'Fraunces',serif;font-weight:600;margin:0;}
  .wrap{max-width:560px;margin:0 auto;padding:40px 20px 80px;}
  .brand{display:flex;align-items:center;gap:10px;font-family:'Fraunces',serif;font-weight:600;font-size:18px;margin-bottom:8px;}
  .brand img{width:28px;height:28px;border-radius:50%;object-fit:cover;}
  h1{font-size:26px;margin-top:18px;}
  .sub{color:var(--ink-dim);font-size:14.5px;margin-top:8px;}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px;margin-top:28px;}
  .field{margin-bottom:18px;}
  .field label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-dim);margin-bottom:7px;text-transform:uppercase;letter-spacing:0.03em;}
  .field input,.field select,.field textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:11px 13px;color:var(--ink);font-family:'Inter',sans-serif;font-size:14.5px;}
  .mode-toggle{display:flex;gap:10px;margin-bottom:20px;}
  .mode-toggle button{flex:1;padding:11px;border-radius:8px;border:1px solid var(--line);background:var(--bg);font-family:'Inter',sans-serif;font-weight:600;font-size:13.5px;cursor:pointer;color:var(--ink-dim);}
  .mode-toggle button.active{background:var(--accent);color:#fff;border-color:var(--accent);}
  .hidden{display:none;}
  .drop{border:1.5px dashed var(--line);border-radius:10px;padding:24px;text-align:center;cursor:pointer;background:var(--bg);}
  .drop input{display:none;}
  .thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:8px;margin-top:14px;}
  .thumbs img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px;border:1px solid var(--line);}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:13px;border-radius:8px;font-weight:600;font-size:14.5px;border:none;cursor:pointer;background:var(--accent);color:#fff;margin-top:6px;}
  .btn:disabled{opacity:0.5;cursor:not-allowed;}
  .status{margin-top:16px;font-size:13.5px;white-space:pre-wrap;}
  .status .ok{color:var(--accent);}
  .status .err{color:#b23b1f;}
  .lock{text-align:center;padding:60px 0;}
  .lock input{max-width:220px;margin:16px auto 0;display:block;text-align:center;}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><img src="images/logo.jpg" alt="">MNK Remodeling</div>

  <div id="lockScreen" class="lock">
    <h1>Add project photos</h1>
    <p class="sub">Enter the admin key to continue.</p>
    <input type="password" id="adminKeyInput" placeholder="Admin key">
    <button class="btn" style="max-width:220px;margin:14px auto 0;" onclick="unlock()">Unlock</button>
    <p class="status" id="lockStatus"></p>
  </div>

  <div id="mainScreen" class="hidden">
    <h1>Add project photos</h1>
    <p class="sub">Upload photos straight into an existing project, or start a brand new one. This goes directly onto the live site — no coding.</p>

    <div class="card">
      <div class="mode-toggle">
        <button id="modeExistingBtn" class="active" onclick="setMode('existing')">Add to existing project</button>
        <button id="modeNewBtn" onclick="setMode('new')">Start a new project</button>
      </div>

      <div id="existingFields">
        <div class="field">
          <label for="projectSelect">Project</label>
          <select id="projectSelect"></select>
        </div>
      </div>

      <div id="newFields" class="hidden">
        <div class="field">
          <label for="serviceSelect">Service category</label>
          <select id="serviceSelect">
            <option value="bathroom">Bathroom Renovation</option>
            <option value="kitchen">Kitchen Remodeling</option>
            <option value="basement">Basement Finishing</option>
            <option value="carpentry">Custom Carpentry</option>
            <option value="flooring">Flooring & Tile</option>
            <option value="whole-home">Whole-Home Remodeling</option>
          </select>
        </div>
        <div class="field">
          <label for="titleInput">Project title</label>
          <input id="titleInput" placeholder="e.g. Smith Family Bathroom">
        </div>
        <div class="field">
          <label for="locationInput">Location (optional)</label>
          <input id="locationInput" placeholder="e.g. Naperville, IL">
        </div>
      </div>

      <div class="field">
        <label>Photos</label>
        <label class="drop" id="dropZone">
          <input type="file" id="fileInput" accept="image/*" multiple>
          <div id="dropHint">Tap to choose one or more photos</div>
          <div class="thumbs" id="thumbs"></div>
        </label>
      </div>

      <button class="btn" id="uploadBtn" disabled>Upload</button>
      <div class="status" id="uploadStatus"></div>
    </div>
  </div>
</div>

<script>
let adminKey = '';
let selectedFiles = [];
let projects = [];
let mode = 'existing';

function unlock(){
  const val = document.getElementById('adminKeyInput').value.trim();
  if(!val){ return; }
  adminKey = val;
  document.getElementById('lockScreen').classList.add('hidden');
  document.getElementById('mainScreen').classList.remove('hidden');
  loadProjects();
}

async function loadProjects(){
  try{
    const res = await fetch('projects.json');
    projects = await res.json();
    const sel = document.getElementById('projectSelect');
    sel.innerHTML = projects.map(p => `<option value="${p.folder}">${p.title} (${p.count} photo${p.count>1?'s':''})</option>`).join('');
  } catch(err){
    document.getElementById('lockStatus').innerHTML = `<span class="err">Couldn't load projects.json: ${err.message}</span>`;
  }
}

function setMode(m){
  mode = m;
  document.getElementById('modeExistingBtn').classList.toggle('active', m==='existing');
  document.getElementById('modeNewBtn').classList.toggle('active', m==='new');
  document.getElementById('existingFields').classList.toggle('hidden', m!=='existing');
  document.getElementById('newFields').classList.toggle('hidden', m!=='new');
}

const fileInput = document.getElementById('fileInput');
const dropZone = document.getElementById('dropZone');
const thumbs = document.getElementById('thumbs');
const uploadBtn = document.getElementById('uploadBtn');

dropZone.addEventListener('click', ()=> fileInput.click());
fileInput.addEventListener('change', e=>{
  selectedFiles = Array.from(e.target.files);
  thumbs.innerHTML = '';
  selectedFiles.forEach(f=>{
    const img = document.createElement('img');
    img.src = URL.createObjectURL(f);
    thumbs.appendChild(img);
  });
  document.getElementById('dropHint').textContent = selectedFiles.length
    ? `${selectedFiles.length} photo${selectedFiles.length>1?'s':''} selected — tap to change`
    : 'Tap to choose one or more photos';
  uploadBtn.disabled = selectedFiles.length === 0;
});

function fileToDataUri(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=> resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

uploadBtn.addEventListener('click', async ()=>{
  if(selectedFiles.length === 0) return;
  uploadBtn.disabled = true;
  const statusEl = document.getElementById('uploadStatus');
  statusEl.innerHTML = '';

  const base = mode === 'existing'
    ? { mode: 'existing', folder: document.getElementById('projectSelect').value }
    : {
        mode: 'new',
        service: document.getElementById('serviceSelect').value,
        title: document.getElementById('titleInput').value.trim(),
        location: document.getElementById('locationInput').value.trim()
      };

  if(mode === 'new' && !base.title){
    statusEl.innerHTML = '<span class="err">Give the new project a title first.</span>';
    uploadBtn.disabled = false;
    return;
  }

  let firstNewFolder = null;

  for(let i=0; i<selectedFiles.length; i++){
    const file = selectedFiles[i];
    statusEl.innerHTML += `Uploading ${i+1} / ${selectedFiles.length}…\n`;
    try{
      const dataUri = await fileToDataUri(file);
      // After the first photo of a brand-new project, keep adding to that
      // same new project instead of creating a second new one.
      const payload = (mode === 'new' && firstNewFolder)
        ? { mode: 'existing', folder: firstNewFolder, adminKey, photo: dataUri }
        : { ...base, adminKey, photo: dataUri };

      const res = await fetch('/api/upload-photo', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      if(!res.ok || data.error) throw new Error(data.error || `HTTP ${res.status}`);

      if(mode === 'new' && !firstNewFolder) firstNewFolder = data.folder;
      statusEl.innerHTML += `<span class="ok">✓ Photo ${data.photoIndex} added to "${data.project}"</span>\n`;
    } catch(err){
      statusEl.innerHTML += `<span class="err">✗ Failed: ${err.message}</span>\n`;
    }
  }

  statusEl.innerHTML += '\nDone. The live site will update automatically in about a minute.';
  selectedFiles = [];
  thumbs.innerHTML = '';
  document.getElementById('dropHint').textContent = 'Tap to choose one or more photos';
  uploadBtn.disabled = true;
  loadProjects();
});

document.getElementById('adminKeyInput').addEventListener('keydown', e=>{
  if(e.key === 'Enter') unlock();
});
</script>
</body>
</html>
